<!DOCTYPE html>
<html>
<head>
<title>Confirmed Scam Database</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 via-black to-gray-900 text-white p-8">

<h1 class="text-3xl font-bold mb-8">🚨 Confirmed Scam Intelligence Database</h1>

<!-- Live Counter -->
<div class="bg-red-700 p-6 rounded-2xl shadow-xl mb-8">
Total Confirmed Scams: {{ data|length }}
</div>

<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

{% for row in data %}

<div class="bg-red-600/80 backdrop-blur-lg p-6 rounded-2xl shadow-xl 
hover:scale-105 transition border border-red-400/20">

<div class="flex justify-between items-center mb-3">

<span class="bg-black/40 px-3 py-1 rounded-full text-sm">
Verified Threat
</span>

<span class="bg-red-800 px-3 py-1 rounded-full text-sm animate-pulse">
High Risk
</span>

</div>

<p class="text-sm break-words">{{ row[0] }}</p>

</div>

{% endfor %}

</div>

<br><br>

<a href="/admin"
class="bg-blue-500 px-6 py-3 rounded-xl shadow-xl hover:bg-blue-600">
⬅ Back Dashboard
</a>

</body>
</html>
