<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gradient-to-br from-black via-gray-900 to-black text-white p-8">

<!-- 🔔 FLASH POPUP (ADDED - DO NOT REMOVE) -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div id="popup"
         class="fixed top-6 right-6 z-50 px-6 py-4 rounded-xl shadow-xl text-white
                {% if messages[0][0] == 'success' %} bg-green-600 {% else %} bg-red-600 {% endif %}">
      {{ messages[0][1] }}
    </div>

    <script>
      setTimeout(() => {
        const popup = document.getElementById("popup");
        if (popup) popup.remove();
      }, 4000);
    </script>
  {% endif %}
{% endwith %}
<!-- 🔔 END FLASH POPUP -->

<h1 class="text-4xl font-bold mb-10">
🛡 Scam Intelligence Command Center
</h1>

<div class="grid md:grid-cols-2 gap-8 mb-10">

<!-- Pending Card -->
<div class="bg-yellow-500/20 backdrop-blur-xl p-8 rounded-2xl shadow-xl border border-yellow-300/20 hover:scale-105 transition">

<h2 class="text-xl mb-3">⚠ Pending Threats</h2>
<p class="text-4xl font-bold">{{ pending }}</p>

</div>

<!-- Confirmed Card -->
<div class="bg-red-500/20 backdrop-blur-xl p-8 rounded-2xl shadow-xl border border-red-300/20 hover:scale-105 transition">

<h2 class="text-xl mb-3">🚨 Confirmed Scams</h2>
<p class="text-4xl font-bold">{{ confirmed }}</p>

</div>

</div>

<!-- Chart -->
<div class="bg-white/10 backdrop-blur-xl p-8 rounded-2xl shadow-xl border border-white/10 mb-10">

<h2 class="text-xl mb-6">📊 Threat Comparison</h2>
<canvas id="statsChart"></canvas>

</div>

<div class="space-x-4">
<a href="/admin/pending" class="bg-blue-600 px-6 py-3 rounded-xl hover:bg-blue-700">
Moderate Pending
</a>

<a href="/admin/confirmed" class="bg-green-600 px-6 py-3 rounded-xl hover:bg-green-700">
View Confirmed
</a>

<a href="/admin/logout" class="bg-gray-700 px-6 py-3 rounded-xl hover:bg-gray-800">
Logout
</a>
</div>

<script>
new Chart(document.getElementById('statsChart'), {
    type: 'bar',
    data: {
        labels: ['Pending','Confirmed'],
        datasets: [{
            label: 'Threat Stats',
            data: [{{ pending }}, {{ confirmed }}]
        }]
    }
});
</script>

</body>
</html>
