<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-black via-gray-900 to-black flex items-center justify-center h-screen">

<div class="bg-white/10 backdrop-blur-xl p-10 rounded-2xl shadow-2xl border border-white/20 w-96">

<h2 class="text-3xl text-white font-bold text-center mb-8">
🔐 Cyber Admin Login
</h2>

<form method="POST">

<input name="username" placeholder="Username"
class="w-full p-3 rounded-xl mb-4 bg-white/20 text-white placeholder-gray-300 focus:outline-none"/>

<input name="password" type="password" placeholder="Password"
class="w-full p-3 rounded-xl mb-6 bg-white/20 text-white placeholder-gray-300 focus:outline-none"/>

<button class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl transition">
Login
</button>

</form>

</div>

</body>
</html>
