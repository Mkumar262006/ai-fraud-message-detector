<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Admin Login</title>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen text-white">
  <form method="POST" class="bg-gray-800 p-8 rounded-2xl shadow-xl w-80 space-y-4">
    <h2 class="text-2xl font-bold text-center">Admin Login</h2>
    <input name="username" placeholder="Username" class="w-full p-2 rounded text-black"/>
    <input name="password" type="password" placeholder="Password" class="w-full p-2 rounded text-black"/>
    <button class="w-full bg-blue-500 p-2 rounded hover:bg-blue-600">Login</button>
  </form>
</body>
</html>
