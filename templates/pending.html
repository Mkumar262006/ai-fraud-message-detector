<!DOCTYPE html>
<html>
<head>
<title>Pending Scams</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-black via-gray-900 to-black text-white p-8">

<h1 class="text-3xl mb-8 font-bold">⚠ Threat Moderation Queue</h1>

<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

{% for msg, count in data %}

<div class="bg-white/10 backdrop-blur-xl p-6 rounded-2xl shadow-xl border border-white/10 hover:scale-105 transition">

<div class="flex justify-between mb-3">

<span class="bg-yellow-500 px-3 py-1 rounded-full text-black">
Reports: {{ count }}
</span>

<span class="bg-orange-600 px-3 py-1 rounded-full animate-pulse">
Under Review
</span>

</div>

<p class="text-sm break-words mb-5">{{ msg }}</p>

<div class="flex justify-between">

<a href="/admin/approve?msg={{ msg | urlencode }}"
class="bg-green-600 px-4 py-2 rounded-xl hover:bg-green-700">
Approve
</a>

<a href="/admin/delete?msg={{ msg | urlencode }}"
class="bg-red-600 px-4 py-2 rounded-xl hover:bg-red-700">
Delete
</a>

</div>

</div>

{% endfor %}

</div>

<br>
<a href="/admin" class="text-blue-400">⬅ Back</a>

</body>
</html>
