<!DOCTYPE html>
<html>
<head>
<title>Pending Scam Moderation</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 via-black to-gray-900 text-white p-8">

<h1 class="text-3xl font-bold mb-6">⚠ Pending Scam Intelligence Queue</h1>

<!-- Search -->
<input id="search" placeholder="Search scam messages..."
class="w-full p-3 mb-8 rounded-xl text-black shadow-lg"/>

<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

{% for msg, count in data %}

<div class="bg-white/10 backdrop-blur-lg p-6 rounded-2xl shadow-xl 
hover:scale-105 transition duration-300 border border-white/10">

<!-- Report Count Badge -->
<div class="flex justify-between items-center mb-3">

<span class="bg-yellow-500 text-black px-3 py-1 rounded-full text-sm">
Reports: {{ count }}
</span>

<span class="bg-orange-600 px-3 py-1 rounded-full text-sm animate-pulse">
Under Review
</span>

</div>

<!-- Message -->
<p class="text-sm mb-6 break-words">{{ msg }}</p>

<!-- Buttons -->
<div class="flex justify-between">

<a href="/admin/approve?msg={{ msg }}"
class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-xl shadow-md">
✔ Approve
</a>

<a href="/admin/delete?msg={{ msg }}"
class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-xl shadow-md">
✖ Delete
</a>

</div>

</div>

{% endfor %}

</div>

<br><br>

<a href="/admin"
class="bg-blue-500 px-6 py-3 rounded-xl shadow-xl hover:bg-blue-600">
⬅ Back Dashboard
</a>

</body>
</html>
